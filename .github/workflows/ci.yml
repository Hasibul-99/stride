name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * *' # nightly full E2E run

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # FAST — runs on every PR and push. Mark THIS job as the required status check
  # in branch protection (Settings → Branches → main). Keep it under ~5 min.
  #   lint → typecheck → web unit (vitest + coverage) → api unit/e2e → build
  # ───────────────────────────────────────────────────────────────────────────
  fast:
    name: fast (lint · typecheck · unit · build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: teamboard
          POSTGRES_PASSWORD: teamboard
          POSTGRES_DB: teamboard
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U teamboard"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: postgresql://teamboard:teamboard@localhost:5432/teamboard?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access
      JWT_REFRESH_SECRET: ci-refresh
      ENCRYPTION_KEY: ci-encryption-key-32-bytes-aaaaaa
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: teamboard
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      SMTP_HOST: localhost
      FRONTEND_URL: http://localhost:5173

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @teamboard/shared build
      - run: pnpm --filter @teamboard/api db:generate
      - run: pnpm --filter @teamboard/api db:deploy

      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck

      - name: Web unit tests + coverage
        run: pnpm --filter @teamboard/web test:coverage

      - name: API unit tests
        run: pnpm --filter @teamboard/api test
      - name: API e2e (supertest)
        run: pnpm --filter @teamboard/api test:e2e

      - name: Build
        run: pnpm build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: apps/web/coverage
          if-no-files-found: warn
          retention-days: 14

  # ───────────────────────────────────────────────────────────────────────────
  # E2E — heavier. Boots the real stack via docker-compose, seeds, then runs
  # Playwright sharded across 3 runners. Gated to PRs targeting main + nightly +
  # pushes to main (skipped on routine feature-branch PRs to keep them fast).
  # ───────────────────────────────────────────────────────────────────────────
  e2e:
    name: e2e (playwright ${{ matrix.shard }}/3)
    needs: fast
    if: >-
      github.event_name == 'schedule' ||
      github.ref == 'refs/heads/main' ||
      github.base_ref == 'main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    env:
      # API process reads these; docker-compose exposes the backing services on localhost.
      DATABASE_URL: postgresql://teamboard:teamboard@localhost:5432/teamboard?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access
      JWT_REFRESH_SECRET: ci-refresh
      ENCRYPTION_KEY: ci-encryption-key-32-bytes-aaaaaa
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: teamboard
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      FRONTEND_URL: http://localhost:5173
      CI: 'true'

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Boot infra (postgres · redis · minio · mailpit)
        run: |
          docker compose up -d --wait postgres redis minio mailpit
          docker compose up createbuckets

      - name: Build shared + generate client
        run: |
          pnpm --filter @teamboard/shared build
          pnpm --filter @teamboard/api db:generate

      - name: Migrate + seed database
        run: |
          pnpm --filter @teamboard/api db:deploy
          pnpm --filter @teamboard/api db:seed

      - name: Build + start API
        run: |
          pnpm --filter @teamboard/api build
          node apps/api/dist/main.js &
          echo "Waiting for API on :3000 ..."
          npx --yes wait-on -t 90000 http://localhost:3000/api/docs

      - name: Install Playwright browsers
        run: pnpm --filter @teamboard/web exec playwright install --with-deps chromium webkit

      - name: Run Playwright (shard ${{ matrix.shard }}/3)
        # Playwright's webServer config starts Vite (web) and proxies /api to the API above.
        # @visual is excluded: its baselines are committed for macOS (darwin) only;
        # generate Linux baselines (see TESTING.md) before enabling them in CI.
        run: pnpm --filter @teamboard/web exec playwright test --shard=${{ matrix.shard }}/3 --grep-invert "@visual"

      - name: Upload Playwright report + traces (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 14

  # ───────────────────────────────────────────────────────────────────────────
  # Docker image build — only on main, after fast passes.
  # ───────────────────────────────────────────────────────────────────────────
  docker:
    needs: fast
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: false
          tags: teamboard-api:${{ github.sha }}
      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: false
          tags: teamboard-web:${{ github.sha }}
