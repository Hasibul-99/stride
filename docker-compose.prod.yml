services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-teamboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-teamboard}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Daily backup helper (cron on the host can invoke this, or use the job below).
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-teamboard}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Daily logical backup at 03:00 (loops; lightweight).
  postgres-backup:
    image: postgres:16-alpine
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - ./backups:/backups
    entrypoint: >
      /bin/sh -c 'while true; do
        sleep $$(( ($$(date -d "tomorrow 03:00" +%s) - $$(date +%s)) ));
        pg_dump -h postgres -U ${POSTGRES_USER:-teamboard} ${POSTGRES_DB:-teamboard} | gzip > /backups/teamboard-$$(date +%F).sql.gz;
        find /backups -name "*.sql.gz" -mtime +14 -delete;
      done'

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: always
    env_file: .env.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 2
    expose:
      - "3000"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: always
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  postgres_data:
  redis_data:
